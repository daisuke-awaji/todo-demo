<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | ToDo 管理</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-auth="pending">
<main class="container narrow" id="main">
<h1 data-testid="page-title">ログイン</h1>
<form id="login-form" data-testid="login-form" novalidate>
<div class="form-error" data-testid="login-error" role="alert" hidden></div>
<div class="field">
<label for="username-input">ユーザー名</label>
<input type="text" id="username-input" data-testid="username-input" autocomplete="username">
<div class="field-error" data-testid="username-error" role="alert" hidden></div>
</div>
<div class="field">
<label for="password-input">パスワード</label>
<input type="password" id="password-input" data-testid="password-input" autocomplete="current-password">
<div class="field-error" data-testid="password-error" role="alert" hidden></div>
</div>
<button type="submit" data-testid="login-submit">ログイン</button>
</form>
</main>
<script src="assets/api.js"></script>
<script src="assets/common.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
